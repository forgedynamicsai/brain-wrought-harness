name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout brain-wrought-engine (scorer dependency)
        uses: actions/checkout@v4
        with:
          repository: forgedynamicsai/brain-wrought-engine
          path: ../brain-wrought-engine

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Poetry
        run: pip install poetry --quiet

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Type check (mypy)
        run: poetry run mypy brain_wrought_harness/

      - name: Test (pytest)
        run: poetry run pytest -q --cov-fail-under=70
