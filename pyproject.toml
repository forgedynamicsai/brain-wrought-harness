[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "brain-wrought"
version = "0.1.0"
description = "CLI and harness for the Brain-Wrought personal-brain benchmark"
authors = ["Arron Street"]
license = "MIT"
readme = "README.md"
packages = [{include = "brain_wrought_harness"}]

[tool.poetry.scripts]
brain-wrought = "brain_wrought_harness.cli:app"

[tool.poetry.dependencies]
python = "3.12.3"
typer = "0.15.2"
click = ">=8.0,<8.2"
pydantic = "2.10.4"
pydantic-settings = "2.7.0"
supabase = "2.10.0"
docker = "7.1.0"
rich = "13.9.4"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.4"
pytest-randomly = "3.15.0"
pytest-cov = "6.0.0"
mypy = "1.13.0"
ruff = "0.8.6"
hypothesis = "6.122.3"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=brain_wrought_harness --cov-report=term-missing"
